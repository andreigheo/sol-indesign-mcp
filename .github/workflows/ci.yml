name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # Portable checks run on Ubuntu. Native Windows ACL and UXP host evidence
    # remains part of the documented Windows acceptance gate.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.13.0 --activate

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Lint
        shell: pwsh
        run: pnpm lint

      - name: Typecheck
        shell: pwsh
        run: pnpm typecheck

      - name: Unit tests
        shell: pwsh
        run: pnpm test

      - name: Contract tests
        shell: pwsh
        run: pnpm test:contract

      - name: Build
        shell: pwsh
        run: pnpm build

      - name: Verify generated UXP bundle
        shell: pwsh
        run: pnpm verify:uxp
